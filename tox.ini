[tox]
envlist =
  py310-dj{22,32,42,52}
  py311-dj{32,42,52}
  py312-dj{32,42,52,60,61}
  py313-dj{42,52,60,61}
  py{314,315}-dj{52,60,61}
  # lowest versions allowed by pyproject.toml for the direct dependencies
  py310-dj{22,42}-lowest
  py{313,315}-dj{52,61}-lowest
  lint

[testenv]
deps =
  dj22: Django>=2.2,<3
  dj32: Django>=3.2,<4
  dj42: Django>=4.2,<5
  dj52: Django>=5.2,<6
  dj60: Django>=6.0,<6.1
  dj61: Django>=6.1,<6.2
  #dj62: Django>=6.2,<7
  coverage>=7.6
  responses>=0.25

extras = dev,bulk_send
uv_resolution =
  lowest: lowest-direct
setenv =
  DJANGO_SETTINGS_MODULE=test_settings
  PYTHONPATH={toxinidir}
commands =
  coverage run {envbindir}/django-admin test
  coverage report

[testenv:lint]
deps =
  flake8
commands =
  # stop the build if there are Python syntax errors or undefined names
  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=.venv,.tox
  # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=.venv,.tox